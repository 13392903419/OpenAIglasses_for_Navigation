<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<!-- 百度地图API - 异步加载 -->
<script>
  window.baiduMapReady = false;
  window.baiduMapCallbacks = [];
  window.onBaiduMapReady = function(cb) {
    if (window.baiduMapReady && typeof BMap !== 'undefined') cb();
    else window.baiduMapCallbacks.push(cb);
  };
  (function() {
    var s = document.createElement('script');
    s.type = 'text/javascript';
    s.async = true;
    var ak = 'JdpmYDQsldEe0886JxFHqOqXFjuXtRd6';
    s.src = 'https://api.map.baidu.com/api?v=3.0&ak=' + encodeURIComponent(ak) + '&callback=baiduMapInit';
    s.onerror = function() { console.error('[地图] API加载失败'); };
    document.head.appendChild(s);
  })();
  function baiduMapInit() {
    if (typeof BMap === 'undefined') return;
    window.baiduMapReady = true;
    window.baiduMapCallbacks.forEach(function(cb) { try { cb(); } catch(e) { console.error(e); } });
    window.baiduMapCallbacks = [];
  }
</script>
<style>
  :root{
    --bg:#f0f6ff; --card:#e0ecf8; --text:#1e293b; --muted:#64748b;
    --ok:#059669; --err:#dc2626; --line:#c7daf0; --panel:rgba(224,236,248,.82);
    --primary:#0891b2; --primary-dark:#0e7490; --accent:#06b6d4;
    --border-radius:16px; --shadow:0 8px 32px rgba(8,145,178,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:linear-gradient(180deg,#f0f6ff,#f0f6ff 60%,#e8f0fe);
    color:var(--text);
    font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial;
  }

  /* ========== 两栏布局 ========== */
  .app{display:grid; grid-template-columns: 1fr 700px; gap:16px; height:100vh; padding:16px}

  /* ========== 左侧：上下两栏（地图 + 摄像头） ========== */
  .stage{
    display:flex; flex-direction:column; gap:12px;
    overflow:hidden;
  }

  /* 上半：地图卡片 */
  .map-card{
    flex:1; display:flex; flex-direction:column; min-height:0;
    border:1px solid var(--line); border-radius:var(--border-radius);
    background:#fff; box-shadow:var(--shadow); overflow:hidden;
  }

  /* 下半：摄像头卡片 */
  .cam-card{
    flex:1; display:flex; flex-direction:column; min-height:0;
    border:1px solid var(--line); border-radius:var(--border-radius);
    background:#fff; box-shadow:var(--shadow); overflow:hidden;
  }
  .cam-header{
    display:flex; align-items:center; gap:10px;
    padding:12px 20px; border-bottom:1px solid var(--line);
    background:linear-gradient(135deg,#f0f6ff,#e8f0fe);
  }
  .cam-header i{color:var(--primary); font-size:18px}
  .cam-header h2{margin:0; font-size:16px; font-weight:700; color:var(--text)}
  .cam-body{
    flex:1; position:relative; background:#dce8f5; min-height:0;
  }
  .cam-body canvas{
    position:absolute; inset:0; width:100%; height:100%; display:block;
  }

  /* 地图头部标题 */
  .map-header{
    display:flex; align-items:center; gap:10px;
    padding:16px 20px; border-bottom:1px solid var(--line);
    background:linear-gradient(135deg,#f0f6ff,#e8f0fe);
  }
  .map-header i{color:var(--primary); font-size:20px}
  .map-header h2{margin:0; font-size:18px; font-weight:700; color:var(--text)}

  /* 地图工具栏 */
  .map-toolbar{
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    padding:12px 20px; border-bottom:1px solid var(--line); background:#f8fbff;
  }
  .map-btn{
    padding:9px 16px; background:#fff; border:1px solid var(--line); color:var(--text);
    border-radius:10px; cursor:pointer; display:flex; align-items:center; gap:8px;
    font-weight:500; font-size:13px; transition:all .2s; white-space:nowrap;
    box-shadow:0 2px 6px rgba(8,145,178,.06);
  }
  .map-btn:hover{background:#e8f4ff; border-color:var(--primary); color:var(--primary)}
  .map-btn i{font-size:13px}

  .search-container{
    display:flex; align-items:center; background:#fff; border:1px solid var(--line);
    border-radius:10px; overflow:hidden; flex:1; min-width:180px; max-width:340px;
    box-shadow:0 2px 6px rgba(8,145,178,.06);
  }
  .search-input{
    padding:9px 14px; border:none; flex:1; outline:none; font-size:13px;
    background:transparent; color:var(--text);
  }
  .search-input::placeholder{color:var(--muted)}
  .search-btn{
    padding:9px 14px; border:none; border-radius:0; background:var(--primary);
    color:#fff; cursor:pointer; transition:background .2s; box-shadow:none;
  }
  .search-btn:hover{background:var(--primary-dark)}

  .more-menu{position:relative}
  .more-dropdown{
    display:none; position:absolute; top:100%; right:0; margin-top:6px;
    background:#fff; border:1px solid var(--line); border-radius:12px;
    box-shadow:0 8px 24px rgba(8,145,178,.12); min-width:200px; z-index:50;
    overflow:hidden;
  }
  .show-dropdown{display:block}
  .dropdown-item{
    display:flex; align-items:center; gap:10px; padding:12px 16px; width:100%;
    border:none; background:none; text-align:left; cursor:pointer; font-size:13px;
    color:var(--text); transition:background .15s;
  }
  .dropdown-item:hover{background:#f0f6ff}
  .dropdown-item i{width:16px; text-align:center; color:var(--primary)}

  /* 目的地信息面板 */
  .destination-info{
    margin:0; padding:12px 20px; background:#f0f9ff;
    border-bottom:1px solid var(--line); border-left:4px solid var(--primary);
  }
  .destination-content{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
  }
  .destination-text{display:flex; align-items:center; gap:8px; font-weight:500; font-size:14px}
  .destination-text i{color:var(--primary)}
  .navigation-btn{
    background:var(--primary) !important; color:#fff !important; border-color:var(--primary) !important;
    font-size:13px;
  }
  .navigation-btn:hover{background:var(--primary-dark) !important}

  /* 地图容器 */
  .map-container{
    flex:1; min-height:300px; position:relative; background:#dce8f5;
  }
  #map{width:100%; height:100%}

  /* 地图加载失败提示 */
  .map-error{
    padding:40px 30px; color:var(--err); font-size:14px;
  }
  .map-error h3{margin:0 0 12px 0; font-size:16px}
  .map-error p{margin:6px 0; color:var(--muted)}
  .map-error ol{margin:12px 0; padding-left:20px; color:var(--muted)}
  .map-error a{color:var(--primary)}

  /* 位置信息条 */
  .location-info{
    padding:14px 20px; background:#f8fbff; border-top:1px solid var(--line);
  }
  .location-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 0; font-size:14px;
  }
  .location-item + .location-item{border-top:1px solid rgba(199,218,240,.5)}
  .location-item span:first-child{color:var(--muted); font-weight:500}
  .location-item span:last-child{font-weight:600; color:var(--text)}

  /* 盲道列表 */
  .blindway-list{
    max-height:200px; overflow-y:auto; padding:14px 20px;
    background:#f8fbff; border-top:1px solid var(--line);
  }
  .blindway-list h4{margin:0 0 10px 0; font-size:14px; color:var(--text)}
  .blindway-item{
    background:#fff; border-radius:10px; padding:10px 14px; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center;
    border-left:4px solid var(--primary); cursor:pointer; transition:all .2s;
    box-shadow:0 2px 6px rgba(8,145,178,.04);
  }
  .blindway-item:hover{transform:translateX(4px); box-shadow:0 4px 12px rgba(8,145,178,.1)}
  .blindway-name{font-weight:500; font-size:13px}
  .blindway-distance{color:var(--primary); font-weight:700; font-size:13px}

  /* ========== 右侧聊天 ========== */
  .chat {
    display:flex; flex-direction:column;
    border:1px solid var(--line); border-radius:var(--border-radius);
    background:var(--card); box-shadow:var(--shadow); overflow:hidden; height:100vh;
  }
  .chat-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
  .badges{display:flex;gap:10px;flex-wrap:wrap}
  .badge{font-size:12px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:rgba(240,246,255,.6)}
  .ok{color:var(--ok);border-color:var(--ok)} .err{color:var(--err);border-color:var(--err)}
  .chat-list{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0}

  .live{padding:12px;border:1px dashed var(--line);border-radius:var(--border-radius);background:#dce8f5}
  .live h2{margin:0 0 8px 0;font-size:14px;color:var(--muted);font-weight:600}
  .partial{font-size:20px;min-height:2.2em;letter-spacing:.2px}

  .finals{
    padding:12px; border:1px solid var(--line); border-radius:var(--border-radius);
    background:#dce8f5; display:flex; flex-direction:column; flex:1; min-height:0;
  }
  .finals h2{margin:0 0 8px 0;font-size:14px;color:var(--muted);font-weight:600}
  .finals ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .bubble{max-width:82%;padding:10px 12px;border-radius:var(--border-radius);border:1px solid var(--line)}
  .from-bot{align-self:flex-start;background:#cde0f5}
  .from-me{align-self:flex-end;background:#b8d8f0}

  .controls{display:flex;gap:8px}
  button{background:var(--primary);border:1px solid var(--primary);color:#fff;border-radius:12px;padding:8px 12px;font-weight:600;cursor:pointer;transition:background .2s}
  button:hover{background:var(--primary-dark)}
  .ghost{background:transparent;border-color:var(--line);color:var(--muted)}

  .hidden-controls{display:none}

  @media (max-width:1100px){
    .app{grid-template-columns:1fr; height:auto}
    .stage{height:60vh}
    .chat{height:60vh}
    .map-toolbar{flex-wrap:wrap}
  }
</style>
</head>
<body>

<div class="app">
  <!-- 左侧：地图 + 摄像头 -->
  <section class="stage">
   <!-- ===== 上半：地图 ===== -->
   <div class="map-card">
    <!-- 标题栏 -->

      <i class="fas fa-map-marker-alt"></i>

<!-- 地图初始化 + 功能占位脚本 -->
<script>
  // ========== 地图变量 ==========
  let map, marker, currentPosition;
  let nearbyBlindwayMarkers = [];
  let nearbyBlindwayPolylines = [];
  let destinationPoint = null;
  let routePolyline = null;
  let destinationMarker = null;

  // ========== 地图初始化 ==========
  function initMap() {
    if (typeof BMap === 'undefined') {
      document.getElementById('map').innerHTML =
        '<div class="map-error">' +
        '<h3>地图加载失败</h3>' +
        '<p>百度地图 SDK 内部配置异常（coordType 为 null）。这表示 AK 未在百度地图控制台中为当前域名授权。</p>' +
        '<p><strong>解决方案：</strong></p>' +
        '<ol>' +
        '<li>访问 <a href="https://lbsyun.baidu.com/apiconsole/key" target="_blank">https://lbsyun.baidu.com/apiconsole/key</a></li>' +
        '<li>找到你的应用和 API Key</li>' +
        '<li>点击"编辑"，在"应用授权"中添加当前域名的白名单，例如 http://localhost:5000</li>' +
        '<li>刷新页面重试</li>' +
        '</ol></div>';
      return;
    }
    map = new BMap.Map('map');
    map.centerAndZoom(new BMap.Point(121.473701, 31.230416), 15);
    map.enableScrollWheelZoom(true);
    map.addControl(new BMap.NavigationControl());
    map.addControl(new BMap.ScaleControl());
    console.log('[地图] 初始化完成');
  }

  // ========== 定位功能 ==========
  function locateMe() {
    if (!map) { console.warn('地图未初始化'); return; }
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          var point = new BMap.Point(pos.coords.longitude, pos.coords.latitude);
          var convertor = new BMap.Convertor();
          convertor.translate([point], 1, 5, function(data) {
            if (data.status === 0 && data.points.length > 0) {
              updateMapPosition(data.points[0]);
            } else {
              updateMapPosition(point);
            }
          });
        },
        function(err) {
          console.warn('浏览器定位失败，尝试百度定位', err);
          tryBaiduGeolocation();
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    } else {
      tryBaiduGeolocation();
    }
  }

  function tryBaiduGeolocation() {
    if (typeof BMap === 'undefined') return;
    var geo = new BMap.Geolocation();
    geo.getCurrentPosition(function(r) {
      if (this.getStatus() === 0) {
        updateMapPosition(r.point);
      } else {
        document.getElementById('currentAddress').textContent = '定位失败';
      }
    });
  }

  function updateMapPosition(point) {
    currentPosition = point;
    map.centerAndZoom(point, 17);
    if (marker) map.removeOverlay(marker);
    marker = new BMap.Marker(point);
    map.addOverlay(marker);
    var geocoder = new BMap.Geocoder();
    geocoder.getLocation(point, function(result) {
      if (result) {
        document.getElementById('currentAddress').textContent = result.address || '未知地址';
      }
    });
  }

  // ========== 搜索目的地 ==========
  function searchDestination(onComplete) {
    var keyword = document.getElementById('destinationInput').value.trim();
    if (!keyword) return;
    if (typeof BMap === 'undefined') return;
    var local = new BMap.LocalSearch(map, {
      onSearchComplete: function(results) {
        if (local.getStatus() === 0 && results.getCurrentNumPois() > 0) {
          var poi = results.getPoi(0);
          destinationPoint = poi.point;
          if (destinationMarker) map.removeOverlay(destinationMarker);
          destinationMarker = new BMap.Marker(poi.point, {
            icon: new BMap.Icon('https://api.map.baidu.com/images/marker_red.png', new BMap.Size(23, 25))
          });
          map.addOverlay(destinationMarker);
          map.panTo(poi.point);
          document.getElementById('destinationName').textContent = poi.title || keyword;
          document.getElementById('destinationInfoPanel').style.display = '';
          if (typeof onComplete === 'function') onComplete();
        }
      }
    });
    local.search(keyword);
  }

  // ========== 更多菜单 ==========
  function toggleMoreMenu() {
    document.getElementById('moreDropdown').classList.toggle('show-dropdown');
  }
  window.addEventListener('click', function(e) {
    if (!e.target.closest('.more-menu')) {
      document.getElementById('moreDropdown').classList.remove('show-dropdown');
    }
  });

  // ========== 路线规划与导航 ==========
  let routeSteps = [];  // 当前路线步骤（用于播报）
  let routePath = [];   // 路线坐标点 [[lng,lat],...]，用于计算当前步骤
  let watchPositionId = null;  // 定位监听句柄
  let currentStepIndex = 0;    // 当前播报的步骤索引

  function planRoute(onSuccess) {
    if (!map || !currentPosition || !destinationPoint) {
      console.warn('[地图] 规划路线需要先定位并设置目的地');
      if (!currentPosition) locateMe();
      toggleMoreMenu();
      return;
    }
    if (typeof BMap === 'undefined') return;
    if (routePolyline) { map.removeOverlay(routePolyline); routePolyline = null; }
    var walk = new BMap.WalkingRoute(map, {
      renderOptions: { map: map, autoViewport: true },
      onSearchComplete: function(results) {
        if (walk.getStatus() === (typeof BMAP_STATUS_SUCCESS !== 'undefined' ? BMAP_STATUS_SUCCESS : 0)) {
          var plan = results.getPlan(0);
          if (plan) {
            var route = plan.getRoute(0);
            routeSteps = [];
            routePath = [];
            currentStepIndex = 0;
            for (var i = 0; i < route.getNumSteps(); i++) {
              var step = route.getStep(i);
              routeSteps.push(step.getDescription());
              try {
                var pt = step.getPosition ? step.getPosition() : (step.getPoint ? step.getPoint() : null);
                if (pt) routePath.push({ lng: pt.lng, lat: pt.lat });
              } catch (e) {}
            }
            if (routePath.length === 0 && route.getPath) {
              var path = route.getPath();
              if (path && path.length) {
                for (var j = 0; j < path.length; j++) {
                  var p = path[j];
                  routePath.push({ lng: p.lng, lat: p.lat });
                }
              }
            }
            console.log('[地图] 路线规划成功，共' + routeSteps.length + '步');
            fetch('/api/navigation/route', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ steps: routeSteps, path: routePath })
            }).catch(function(e) { console.warn('[地图] 上报路线失败', e); });
            if (typeof onSuccess === 'function') onSuccess();
          }
        } else {
          console.warn('[地图] 路线规划失败');
        }
        toggleMoreMenu();
      }
    });
    walk.search(currentPosition, destinationPoint);
  }

  function startNavigation() {
    if (!currentPosition || !destinationPoint) {
      console.warn('[地图] 请先定位并设置目的地');
      return;
    }
    if (watchPositionId !== null) return;  // 已在导航中
    if (routeSteps.length === 0) {
      planRoute(function() { startNavigation(); });
      return;
    }
    function haversineDist(p1, p2) {
      var R = 6371000;
      var dlat = (p2.lat - p1.lat) * Math.PI / 180;
      var dlon = (p2.lng - p1.lng) * Math.PI / 180;
      var a = Math.sin(dlat/2)*Math.sin(dlat/2) + Math.cos(p1.lat*Math.PI/180)*Math.cos(p2.lat*Math.PI/180)*Math.sin(dlon/2)*Math.sin(dlon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    function computeStepIndex(lng, lat) {
      if (!routePath.length || !routeSteps.length) return 0;
      var user = { lng: lng, lat: lat };
      if (routePath.length === routeSteps.length) {
        var best = 0, bestD = 1e9;
        for (var i = 0; i < routePath.length; i++) {
          var d = haversineDist(user, routePath[i]);
          if (d < bestD) { bestD = d; best = i; }
        }
        return Math.min(best, routeSteps.length - 1);
      }
      var stepLen = Math.floor(routePath.length / routeSteps.length) || 1;
      var best = 0, bestD = 1e9;
      for (var i = 0; i < routeSteps.length; i++) {
        var idx = Math.min(i * stepLen, routePath.length - 1);
        var d = haversineDist(user, routePath[idx]);
        if (d < bestD) { bestD = d; best = i; }
      }
      return best;
    }
    function onPosition(pos) {
      var pt = new BMap.Point(pos.coords.longitude, pos.coords.latitude);
      var convertor = new BMap.Convertor();
      convertor.translate([pt], 1, 5, function(data) {
        if (data.status === 0 && data.points.length > 0) {
          var bdPt = data.points[0];
          updateMapPosition(bdPt);
          var stepIdx = computeStepIndex(bdPt.lng, bdPt.lat);
          if (stepIdx > currentStepIndex) currentStepIndex = stepIdx;
          fetch('/api/navigation/position', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ lng: bdPt.lng, lat: bdPt.lat, step_index: currentStepIndex })
          }).catch(function() {});
        }
      });
    }
    if (navigator.geolocation && navigator.geolocation.watchPosition) {
      watchPositionId = navigator.geolocation.watchPosition(onPosition, function() {}, { enableHighAccuracy: true, maximumAge: 5000 });
      console.log('[地图] 导航已启动，实时定位中');
    } else {
      tryBaiduGeolocation();
    }
  }

  function stopNavigation() {
    if (watchPositionId !== null && navigator.geolocation.clearWatch) {
      navigator.geolocation.clearWatch(watchPositionId);
      watchPositionId = null;
    }
  }

  // ========== 占位函数（后续实现API接入） ==========
  function enableManualStartLocation() { console.log('TODO: 手动选择当前位置'); toggleMoreMenu(); }
  function enableManualDestination() { console.log('TODO: 手动选择目的地'); toggleMoreMenu(); }
  function showNearbyBlindways() { console.log('TODO: 查找周边盲道'); toggleMoreMenu(); }

  // ========== 页面加载时初始化地图 ==========
  window.addEventListener('load', function() {
    window.onBaiduMapReady(initMap);
  });

  // ========== PWA Service Worker 注册 ==========
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/static/service-worker.js', { scope: '/' })
        .then(function(registration) {
          console.log('[PWA] Service Worker 注册成功:', registration);
          
          // 检查更新
          setInterval(function() {
            registration.update();
          }, 3600000); // 每小时检查一次
        })
        .catch(function(err) {
          console.warn('[PWA] Service Worker 注册失败:', err);
        });
    });

    // 检测新版本可用
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  }

  // ========== PWA 安装提示 ==========
  let installPromptEvent = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    installPromptEvent = e;
    console.log('[PWA] 支持离线安装');
    
    // 显示安装按钮（可选）
    const installBtn = document.getElementById('installBtn');
    if (installBtn) {
      installBtn.style.display = 'block';
      installBtn.addEventListener('click', function() {
        if (installPromptEvent) {
          installPromptEvent.prompt();
          installPromptEvent.userChoice.then(function(choiceResult) {
            if (choiceResult.outcome === 'accepted') {
              console.log('[PWA] 用户接受安装');
            } else {
              console.log('[PWA] 用户拒绝安装');
            }
            installPromptEvent = null;
          });
        }
      });
    }
  });

  window.addEventListener('appinstalled', function() {
    console.log('[PWA] 应用已安装到主屏幕');
    installPromptEvent = null;
  });
</script>
